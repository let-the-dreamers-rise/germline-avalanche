name: Publish web pages

# Serves web/ on GitHub Pages, so the try page has a plain link:
#   https://let-the-dreamers-rise.github.io/germline-avalanche/try.html
# One-time setup: Settings -> Pages -> Build and deployment -> Source:
# "GitHub Actions". Until then the deploy step fails and nothing else is affected.

on:
  push:
    branches: [main]
    paths: ["web/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Publish web/ to GitHub Pages
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v4
